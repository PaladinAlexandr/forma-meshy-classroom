x-app: &app
  build: .
  env_file: .env
  environment:
    POSTGRES_HOST: db
    REDIS_URL: redis://redis:6379/0
    DJANGO_DEBUG: '0'
    TRUST_PROXY_HEADERS: '1'
    MEDIA_ROOT: /app/media
  volumes:
    - media:/app/media
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studio}
      POSTGRES_USER: ${POSTGRES_USER:-studio}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    volumes:
      - redisdata:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  web:
    <<: *app
    command: sh -c 'python manage.py migrate --noinput && python manage.py bootstrap && python manage.py collectstatic --noinput && gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 2 --timeout 120 --access-logfile -'
    depends_on:
      db: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ['CMD', 'python', '-c', "import urllib.request; urllib.request.urlopen(urllib.request.Request('http://127.0.0.1:8000/health/', headers={'Host':'${APP_DOMAIN:?Set APP_DOMAIN}', 'X-Forwarded-Proto':'https'}), timeout=5)"]
      interval: 10s
      timeout: 8s
      start_period: 60s
      retries: 12
  worker:
    <<: *app
    command: celery -A config worker --loglevel=INFO --concurrency=2
    depends_on:
      web: {condition: service_healthy}
  beat:
    <<: *app
    command: celery -A config beat --loglevel=INFO --schedule=/tmp/celerybeat-schedule
    depends_on:
      web: {condition: service_healthy}
  proxy:
    image: caddy:2-alpine
    environment:
      APP_DOMAIN: ${APP_DOMAIN:?Set APP_DOMAIN in .env}
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    depends_on:
      web: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  media:
  caddydata:
  caddyconfig:
